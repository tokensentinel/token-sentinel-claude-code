[project]
name = "token-sentinel-claude-code"
version = "0.1.0"
description = "TokenSentinel for Claude Code - host plugin bridge to token-sentinel-adapter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TokenSentinel contributors", email = "hello@tokensentinel.dev" }]
dependencies = [
    "token-sentinel>=1.0.3,<2",
    "token-sentinel-adapter>=0.1.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokensentinel_claude_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
